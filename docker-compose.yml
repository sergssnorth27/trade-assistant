services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
      POSTGRES_DB: trade_assistant
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_assistant"]
      interval: 3s
      retries: 10

  
  app:
    build: .
    environment:
      DATABASE_URL: postgres://trade:trade@postgres:5432/trade_assistant?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
 
volumes:
  pgdata: